controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    robile_hub_wheels_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robile_hub_wheels_controller:
  ros__parameters:
    joints:
      - robile_1_drive_left_hub_wheel_joint
      - robile_1_drive_right_hub_wheel_joint
      - robile_3_drive_left_hub_wheel_joint
      - robile_3_drive_right_hub_wheel_joint
      - robile_7_drive_left_hub_wheel_joint
      - robile_7_drive_right_hub_wheel_joint
      - robile_9_drive_left_hub_wheel_joint
      - robile_9_drive_right_hub_wheel_joint
      - robile_13_drive_left_hub_wheel_joint
      - robile_13_drive_right_hub_wheel_joint
      - robile_15_drive_left_hub_wheel_joint
      - robile_15_drive_right_hub_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
      - position
    