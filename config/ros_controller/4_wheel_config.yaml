controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    robile_hub_wheels_controller:
      type: velocity_controllers/JointGroupVelocityController

robile_hub_wheels_controller:
  ros__parameters:
    joints:
      - robile_1_drive_left_hub_wheel_joint
      - robile_1_drive_right_hub_wheel_joint
      - robile_2_drive_left_hub_wheel_joint
      - robile_2_drive_right_hub_wheel_joint
      - robile_5_drive_left_hub_wheel_joint
      - robile_5_drive_right_hub_wheel_joint
      - robile_6_drive_left_hub_wheel_joint
      - robile_6_drive_right_hub_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
      - position
